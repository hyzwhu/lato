name: ci

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  test-unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace a3_1_windows_spellings_share_lock_key
      - run: cargo test --workspace a3_2_parallel_edit_spellings_serialized
      - run: cargo test --workspace a3_5_default_shell
      - run: cargo test --workspace a0_1_headless
      - run: cargo test --workspace d1_4_windows_restricted_token_workspace_write_isolation
      - run: cargo test --workspace d1_5_missing_wrapper_refuses_without_off_fallback
      - run: cargo test --workspace

  no-live-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          if grep -R "#\[.*test\].*LIVE" -n crates tests; then
            echo "LIVE tests must not run in PR CI" >&2
            exit 1
          fi
