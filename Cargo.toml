[workspace]
resolver = "3"
members = [
    ".",
    "crates/lato-core",
    "crates/lato-policy",
    "crates/lato-runtime",
    "crates/lato-protocol",
    "crates/lato-workspace",
    "crates/lato-ai",
    "crates/lato-tools",
    "crates/lato-agent",
    "crates/lato-extensions",
    "crates/lato-mcp",
    "crates/lato-store",
]

[package]
name = "lato"
version = "0.1.0-beta.2"
edition = "2024"

[dependencies]
lato-core = { path = "crates/lato-core" }
lato-policy = { path = "crates/lato-policy" }
lato-protocol = { path = "crates/lato-protocol" }
lato-workspace = { path = "crates/lato-workspace" }
lato-ai = { path = "crates/lato-ai" }
lato-tools = { path = "crates/lato-tools" }
lato-agent = { path = "crates/lato-agent" }
lato-extensions = { path = "crates/lato-extensions" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util", "io-std", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
reqwest = "0.12"
async-trait = "0.1"
rpassword = "7"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
unicode-width = "0.2"
unicode-segmentation = "1"

[dev-dependencies]
tempfile = "3"
zstd = "0.13"
