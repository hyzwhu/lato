[workspace]
resolver = "3"
members = [
    ".",
    "crates/lato-protocol",
    "crates/lato-workspace",
    "crates/lato-ai",
    "crates/lato-tools",
    "crates/lato-agent",
    "crates/lato-mcp",
]

[package]
name = "lato"
version = "0.1.0"
edition = "2024"

[dependencies]
lato-protocol = { path = "crates/lato-protocol" }
lato-workspace = { path = "crates/lato-workspace" }
lato-ai = { path = "crates/lato-ai" }
lato-tools = { path = "crates/lato-tools" }
lato-agent = { path = "crates/lato-agent" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util", "io-std", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
reqwest = "0.12"
async-trait = "0.1"
rpassword = "7"

[dev-dependencies]
tempfile = "3"
