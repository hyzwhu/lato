[package]
name = "lato-core"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
futures-core = "0.3"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "time"] }
