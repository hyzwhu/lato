[package]
name = "lato-ai"
version = "0.1.0"
edition = "2024"

[dependencies]
lato-core = { path = "../lato-core" }
lato-protocol = { path = "../lato-protocol" }
futures-util = "0.3"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "sync", "io-util", "macros", "rt"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
dirs = "6"
reqwest = { version = "0.12", features = ["json", "stream"] }
fs2 = "0.4"
async-trait = "0.1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
url = "2"
httpdate = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
