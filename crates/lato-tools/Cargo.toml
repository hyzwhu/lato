[package]
name = "lato-tools"
version = "0.1.0"
edition = "2024"

[dependencies]
lato-core = { path = "../lato-core" }
lato-policy = { path = "../lato-policy" }
lato-workspace = { path = "../lato-workspace" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
thiserror = "2"
sha2 = "0.10"
regex = "1"
tokio = { version = "1", features = ["fs", "process", "io-util", "macros", "rt"] }
reqwest = { version = "0.12" }
url = "2"

[target.'cfg(windows)'.dependencies]
zagens-windows-sandbox = { version = "0.8.9", features = ["windows-impl"] }

[dev-dependencies]
tempfile = "3"
tokio-util = { version = "0.7", features = ["rt"] }
