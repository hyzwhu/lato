[package]
name = "lato-tools"
version = "0.1.0"
edition = "2024"

[dependencies]
lato-workspace = { path = "../lato-workspace" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
tokio = { version = "1", features = ["fs", "process", "io-util", "macros", "rt"] }

[dev-dependencies]
tempfile = "3"
