[package]
name = "lato-workflow"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
lato-core = { path = "../lato-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
