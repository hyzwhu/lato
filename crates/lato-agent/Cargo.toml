[package]
name = "lato-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
lato-protocol = { path = "../lato-protocol" }
lato-workspace = { path = "../lato-workspace" }
lato-ai = { path = "../lato-ai" }
lato-tools = { path = "../lato-tools" }
lato-mcp = { path = "../lato-mcp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
fs2 = "0.4"
reqwest = "0.12"

[dev-dependencies]
tempfile = "3"
