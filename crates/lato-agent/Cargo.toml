[package]
name = "lato-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
lato-core = { path = "../lato-core" }
lato-extensions = { path = "../lato-extensions" }
lato-runtime = { path = "../lato-runtime" }
lato-protocol = { path = "../lato-protocol" }
lato-workspace = { path = "../lato-workspace" }
lato-ai = { path = "../lato-ai" }
lato-tools = { path = "../lato-tools" }
lato-mcp = { path = "../lato-mcp" }
lato-policy = { path = "../lato-policy" }
lato-store = { path = "../lato-store" }
lato-workflow = { path = "../lato-workflow" }
jsonschema = "0.30"
semver = "1"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
dirs = "6"
fs2 = "0.4"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip"] }
async-trait = "0.1"
futures-util = "0.3"

[dev-dependencies]
flate2 = "1"
rcgen = "0.13"
tokio-rustls = "0.26"
rustls = "0.23"
