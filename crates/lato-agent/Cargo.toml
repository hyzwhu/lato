[package]
name = "lato-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
lato-core = { path = "../lato-core" }
lato-extensions = { path = "../lato-extensions" }
lato-runtime = { path = "../lato-runtime" }
lato-protocol = { path = "../lato-protocol" }
lato-workspace = { path = "../lato-workspace" }
lato-ai = { path = "../lato-ai" }
lato-tools = { path = "../lato-tools" }
lato-mcp = { path = "../lato-mcp" }
lato-store = { path = "../lato-store" }
lato-workflow = { path = "../lato-workflow" }
jsonschema = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
fs2 = "0.4"
reqwest = "0.12"
async-trait = "0.1"
futures-util = "0.3"

[dev-dependencies]
lato-policy = { path = "../lato-policy" }
semver = "1"
tempfile = "3"
