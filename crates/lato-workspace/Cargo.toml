[package]
name = "lato-workspace"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
lato-core = { path = "../lato-core" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "macros", "rt"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
