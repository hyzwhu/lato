[package]
name = "lato-store"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
lato-core = { path = "../lato-core" }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
