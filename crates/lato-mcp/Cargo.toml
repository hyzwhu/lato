[package]
name = "lato-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
dunce = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"

[dev-dependencies]
tempfile = "3"
