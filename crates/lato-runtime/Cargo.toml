[package]
name = "lato-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
lato-core = { path = "../lato-core" }
lato-store = { path = "../lato-store" }
lato-workspace = { path = "../lato-workspace" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }
